<form class="formulario" (ngSubmit)="cargar()">
  <label for="monto-carga">Monto</label>
  <app-campo-monto
    idCampo="monto-carga"
    nombreCampo="montoCarga"
    descripcionId="nota-carga"
    [(valor)]="monto"
  />
  <p id="nota-carga" class="nota">Carga simulada: no hay pasarela real</p>
  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Cargando…' : 'Cargar' }}
  </button>
</form>

@if (error()) {
  <p class="mensaje error" role="alert">{{ error() }}</p>
}
@if (aviso()) {
  <p class="mensaje exito" role="status">{{ aviso() }}</p>
}
