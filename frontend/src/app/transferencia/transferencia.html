@if (otras().length === 0) {
  <p class="vacio">Crea otra cuenta para poder enviarle plata.</p>
} @else {
  <form class="formulario" (ngSubmit)="transferir()">
    <label for="destino-transferencia">Para</label>
    <select id="destino-transferencia" name="destino" [(ngModel)]="destino">
      <option [ngValue]="null" disabled>Elige una cuenta</option>
      @for (c of otras(); track c.id) {
        <option [ngValue]="c.id">{{ c.nombre }}</option>
      }
    </select>

    <label for="monto-transferencia">Monto</label>
    <app-campo-monto
      idCampo="monto-transferencia"
      nombreCampo="montoTransferencia"
      [(valor)]="monto"
    />

    <label for="concepto-transferencia">Concepto (¿para qué es?)</label>
    <input id="concepto-transferencia" name="concepto" autocomplete="off" [(ngModel)]="concepto" />

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Enviando…' : 'Enviar' }}
    </button>
  </form>
}

@if (error()) {
  <p class="mensaje error" role="alert">{{ error() }}</p>
}
@if (aviso()) {
  <p class="mensaje exito" role="status">{{ aviso() }}</p>
}
